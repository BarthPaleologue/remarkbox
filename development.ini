# Config File Reference:
# http://docs.pylonsproject.org/projects/pyramid/en/latest/narr/environment.html

[alembic]
script_location = remarkbox/scripts/alembic
sqlalchemy.url = sqlite:///%(here)s/data/remarkbox.sqlite

[app:main]
use = egg:remarkbox

#sqlalchemy.url = postgres://localhost/remarkbox
sqlalchemy.url = sqlite:///%(here)s/remarkbox.sqlite

###
# Pyramid configuration.
###
pyramid.reload_templates = true
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en
pyramid.includes =
    pyramid_debugtoolbar
    pyramid_tm

# By default, the toolbar only appears for clients from IP addresses
# '127.0.0.1' and '::1'.
# debugtoolbar.hosts = 127.0.0.1 ::1

###
# session / cookie configuration.
# http://docs.pylonsproject.org/docs/pyramid/en/latest/api/session.html
###
session.hashalg = sha512
# Session cookies are SIGNED, not encrypted, so this value alone forges any
# session — including a superuser's. It must come from our environment.
# The dev fallback keeps `make config` installs working locally; our startup
# guard in remarkbox/__init__.py refuses to boot with it once our debug
# toolbar is off, so a production deploy cannot inherit it silently.
session.secret  = ${REMARKBOX_SESSION_SECRET:-insecure-development-secret}
session.timeout = 31104000
session.max_age = 31104000
session.reissue_time = 15552000
# `none` is required for our embed product (third-party iframes). Browsers
# reject SameSite=None without Secure, and http://localhost counts as a secure
# context, so this stays true in development too.
session.samesite = none
session.secure = True

###
# API configuration.
###
api.enabled = true
api.rate_limit.read_requests = 120
api.rate_limit.write_requests = 30
api.rate_limit.window = 60
api.rate_limit.create_thread_requests = 1
api.rate_limit.create_thread_window = 420
# non-API paths to throttle under the same buckets, whitespace separated.
# /preview-post runs a pandoc subprocess for anonymous callers.
api.rate_limit.extra_paths = /preview-post
# Expensive exports get their own small bucket: a whole-namespace .pdf runs
# pandoc plus wkhtmltopdf over every thread, unauthenticated, and sharing our
# 120/min read bucket let one caller ask for 120 of those a minute.
api.rate_limit.export_requests = 5
api.rate_limit.export_window = 60
api.rate_limit.export_formats = pdf epub docx odt

###
# spam detection.
###
spam.enabled = true
spam.hard_threshold = 0.8
spam.soft_threshold = 0.5
spam.llm.enabled = true
spam.llm.endpoint = https://hermes.ai.unturf.com/v1/chat/completions
spam.llm.model = solidrust/Hermes-3-Llama-3.1-8B-AWQ
spam.llm.timeout = 5

###
# custom app configuration.
###
app.avatar.size = 35

# In prod I set this to: remarkbox.com (default = "")
#app.root_domain =
#app.root_domain = localhost
app.root_domain = ${REMARKBOX_APP_ROOT_DOMAIN:-localhost}

# If set we force all links related to `join or log in` to this base url 
# and use this url for links in email notifications.
# Also useful when multiple subdomains point at the same Remarkbox cluster.
# In prod I set this to: https://my.remarkbox.com (default = request.host_url)
#app.app_url =
#app.root_domain = http://localhost:6543
app.app_url = ${REMARKBOX_APP_URL:-http://localhost:6543}


# if your marketing / main landing page base url is different then app url.
# In prod I set this to: https://www.remarkbox.com (default = request.app_url)
#app.marketing_url =

# if Node is None, we may safely redirect to this uri. optional.
#app.safe_redirect = https://www.remarkbox.com

app.email.relay = localhost
app.email.sender = no-reply@remarkbox.com

# set this to the path of your private DKIM key.
# reference: https://russell.ballestrini.net/quickstart-to-dkim-signed-email-with-python/
#app.email.dkim_private_key_path =
#app.email.dkim_selector =

# The app name in the email subject (default = request.app_domain)
# In production I set this to "Remarkbox".
app.email.subject_postfix = Remarkbox

# optional theme plugin name.
#app.theme = westworld
app.theme = meta

# optional theme plugin name for embed mode.
#app.theme_embed = meta

# stand-alone mode disables a bunch of views and templates
# related to billing and registering Namespaces.
# choices enabled or disabled. defaults to disabled.
#app.stand_alone_mode = disabled

# stripe: Stripe Checkout payment processing.
# This syntax will automatically expand an ENV var of the same name.
app.stripe.secret = ${REMARKBOX_APP_STRIPE_SECRET}
app.stripe.public = ${REMARKBOX_APP_STRIPE_PUBLIC}
app.stripe.webhook_secret = ${REMARKBOX_APP_STRIPE_WEBHOOK_SECRET:-}

# slack: bot notifications.
app.slack.secret = ${REMARKBOX_APP_SLACK_SECRET}
app.slack.public = ${REMARKBOX_APP_SLACK_PUBLIC}
app.slack.oauth_scope = incoming-webhook
app.discord.secret = ${REMARKBOX_APP_DISCORD_SECRET}
app.discord.public = ${REMARKBOX_APP_DISCORD_PUBLIC}
app.discord.oauth_scope = webhook.incoming

# feature flag for email notifications.
#app.deliver_email_notifications = true

# robots.txt contents.
#app.robots_dot_txt =
#    User-agent: *
#    Disallow:

###
# wsgi server configuration
###
[server:main]
use = egg:waitress#main
host = 0.0.0.0
port = 6543

###
# logging configuration
# http://docs.pylonsproject.org/projects/pyramid/en/latest/narr/logging.html
###
[loggers]
keys = root, remarkbox, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_remarkbox]
level = DEBUG
handlers =
qualname = remarkbox

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
# "level = INFO" logs SQL queries.
# "level = DEBUG" logs SQL queries and results.
# "level = WARN" logs neither.  (Recommended for production systems.)

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s][%(threadName)s] %(message)s

[pshell]
m = remarkbox.models
