[app:main]
use = egg:remarkbox

pyramid.reload_templates = true
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en
pyramid.includes =
    pyramid_tm

sqlalchemy.url = sqlite:///%(here)s/foxhop.net.sqlite

session.hashalg = sha512
session.secret  = local-foxhop-test
session.timeout = 31104000
session.max_age = 31104000
session.reissue_time  = 15552000
session.secure  = False
session.samesite  = lax

app.avatar.size = 36
app.email.relay = localhost
app.email.sender = no-reply@foxhop.net
app.theme = chaostheory
app.stand_alone_mode = enabled
app.namespace = foxhop.net

[server:main]
use = egg:waitress#main
host = 0.0.0.0
port = 6004

[alembic]
script_location = remarkbox:scripts/alembic
sqlalchemy.url = sqlite:///%(here)s/foxhop.net.sqlite

[loggers]
keys = root, remarkbox, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_remarkbox]
level = DEBUG
handlers =
qualname = remarkbox

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s][%(threadName)s] %(message)s

[pshell]
m = remarkbox.models
